    группы служат только для навигации.

    У каждого изображения есть постоянный номер, например REF-014. При обсуждении удобно
    называть его: так замечание точно относится к нужной картинке.
  source_note: Источник — подборка архитектора в Pinterest. По каждому изображению доступна ссылка на исходную публикацию.
