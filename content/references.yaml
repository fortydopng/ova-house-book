    where: Спальня.
  - id: REF-003
    title: Спальня с пейзажным панно и деревянной стеной
    description: Светлая кровать, тёмные прикроватные детали, отделка стены с древесной фактурой и крупное пейзажное
      изображение на соседней поверхности.
    width: 1800
    height: 2700
    pin: https://www.pinterest.com/pin/177258935328840857/
    status: option
    take: Ненавязчивый природный пейзаж в спальне.
    avoid: Деревянную отделку и мебель целиком.
    where: Спальня.
  - id: REF-004
    title: Градации серо-бежевых оттенков
    description: Карточка оттенков от тёмного серо-коричневого до почти белого с подписью Light Taupe.
    width: 1280
    height: 1320
    pin: https://www.pinterest.com/pin/177258935329009734/
    status: excluded
    reason: интереса не выражено
  - id: REF-005
    title: Зеркало, скамья и галерея фотографий
    description: Высокое зеркало в золотистом обрамлении, мягкая скамья и симметрично размещённые фотографии. На
      светлой стене и под потолком видны декоративные профили.
    width: 1242
    height: 1341
    pin: https://www.pinterest.com/pin/177258935328893498/
    status: detail
    take: Галерея фотографий или картин с зеркалом в холле — сама композиционная идея.
    avoid: 'Фигурный декор: линии строже и прямее.'
    where: Холл.
    ask: Какую именно деталь исключить.
  - id: REF-006
    title: Линейная кухня с контрастным фартуком
    description: Нижние фасады с древесной фактурой и горизонтальные рабочие поверхности. Фартук имеет светлый фон
      и выразительные бордово-тёмные прожилки; верхняя часть стены оформлена светлыми панелями.
    width: 1200
    height: 800
    pin: https://www.pinterest.com/pin/177258935328852838/
    status: excluded
    reason: пропущен
  - id: REF-007
    title: Входная зона со шкафом и банкеткой
    description: Светлый высокий шкаф, узкая мягкая банкетка, деревянные вертикальные поверхности и светлый пол
      с тёмным контуром. На потолке видны подвесной светильник и подсветка.
    width: 1080
    height: 1920
    pin: https://www.pinterest.com/pin/177258935329009720/
    status: lead
    take: 'Композиция входной зоны целиком: зеркало с подсветкой, светильник, встроенный шкаф и банкетка.'
    avoid: Модель светильника — возможна другая; размеры и расстановку адаптировать к дому.
    where: Входная зона.
  - id: REF-008
    title: Светлый камень с бордовыми прожилками
    description: Крупный образец светлой поверхности с бордовыми, серыми и почти чёрными прожилками; точный материал
