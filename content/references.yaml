# OVA-HOUSE — референсы стиля (подборка архитектора). Источник правды для страницы docs/references/.
# Собирается вместе с книгой: python build.py
#
# Изображения: python ingest.py refs 1 ref-001.jpg ref-002.jpg ...  → docs/img/refs/v1/ref-NNN-{900,1600}.webp
# (исходники — файлы REF-NNN_*.jpg из стилевого альбома v01, переименованные в ref-nnn.jpg)
#
# REF-ID постоянны и совпадают с альбомом v01 (OVA_HOUSE_Style_Album_v01_2026-09-20) и бланком
# пояснений хозяина; новые изображения продолжают нумерацию после REF-050.
# Названия и описания — из реестра альбома; служебные примечания о происхождении файлов убраны.

references:
