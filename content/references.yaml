# OVA-HOUSE — референсы стиля (подборка архитектора). Источник правды для страницы docs/references/.
# Собирается вместе с книгой: python build.py
#
# Версия 2 (20.09.2026): отбор изображений и пояснения к каждому — что берём (take), чего не переносим (avoid),
# где применяем (where), что уточнить (ask); status: main / lead / option / detail / check / open,
# excluded — карточка не показывается, причина в reason (изображение остаётся в docs/img/refs/v1/).
# REF-ID постоянны и совпадают с альбомом v01 на Google Drive; новые изображения продолжают нумерацию после REF-050.
# Изображения: python ingest.py refs 1 ref-NNN.jpg ...  → docs/img/refs/v1/ref-NNN-{900,1600}.webp

references:
  slug: references
  title: Референсы
  subtitle: Отобранные референсы
  version: 2
  date: '2026-09-20'
  img_version: 1
  count_note: 28 изображений
  intro: 'Из подборки архитектора оставлены изображения, в которых есть приём, деталь или сочетание для дома. У
    каждого указано, что именно из него берём, чего не переносим и что ещё предстоит уточнить. Группы служат для
    навигации; изображения не привязаны к конкретным помещениям проекта.


    У каждого изображения постоянный номер, например REF-017. При обсуждении удобно называть его.'
  home_lead: 'Отобранные изображения с пояснениями: что из них берём, чего не переносим.'
  source_note: Источник — подборка архитектора в Pinterest. По каждому изображению доступна ссылка на исходную публикацию.
    Изображения, не вошедшие в отбор, сохранены в архиве проекта под теми же номерами.
  home_strip:
  - REF-017
  - REF-019
  - REF-021
  - REF-036
  - REF-007
  - REF-011
  statuses:
    main: Основной ориентир
    lead: Ориентир
    option: Вариант
    detail: Деталь
    check: К проверке
    open: Уточняется
  guidelines:
  - name: Палитра
    items:
    - Оливковый, золотистые и бронзовые акценты, светлые молочные тона, дерево и светлый камень — база REF-017.
    - Цвета и фурнитура подбираются в связи со всем домом; конкретные панно, мебель и свет — по помещениям.
  - name: Приёмы
    items:
    - Пейзажные панно с мягкими деревьями.
    - Зеркала рядом с деревянной отделкой; стеновые панели в отдельных зонах и коридорах.
    - Мягкая подсветка по периметру.
    - Три каскадные люстры в центре гостиной — модель и металл не выбраны.
    - Керамогранит на полу и на камине — без выбора артикула.
  - name: Границы
    items:
    - Образ не делать тяжёлым или гламурным.
    - Без холодного настроения и чрезмерного глянца.
    - Пёстрый камень — с осторожностью.
    - 'Кессонные потолки не используем: членение на квадраты уменьшает пространство и спорит с панно.'
