    width: 1068
    height: 1686
    pin: https://www.pinterest.com/pin/177258935329009724/
    status: option
    take: Стеновые панели как отделка отдельных зон и коридоров (в том числе бамбуковые); бронзовый оттенок металла
      в сочетании с деревом.
    avoid: Стулья. Материал панелей по фотографии не подтверждён.
    where: Коридоры и отдельные зоны.
    ask: Материал и образец панелей.
  - id: REF-010
