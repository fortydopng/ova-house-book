# OVA-HOUSE — книга интерьеров. Единственный источник правды для сайта.
# Сайт собирается командой: python build.py  (результат в docs/)

site:
  title: OVA-HOUSE
  subtitle: Книга интерьеров
  description: Визуализации интерьеров частного дома, по помещениям, в актуальных версиях.
  base_url: https://fortydopng.github.io/ova-house-book/
  version: 4
  updated: 2026-09-13
  hero:
    room: "1.11"
    image: e-day
  about: |
    Здесь собраны визуализации интерьеров дома — по каждому помещению, в актуальной версии.
    Геометрия помещений, окна и планировка соответствуют проекту; мебель и предметы подобраны
    как убедительное приближение к выбранным референсам и уточняются по ходу согласования.

    У помещения, кроме изображений, есть раздел «Что здесь нарисовано»: какие из показанных
    предметов и материалов — конкретные изделия производителей, что делается на заказ,
    а что ещё подбирается. Книга обновляется по мере работы: у каждого помещения есть
    номер версии и дата.

# Статусы: planned — не начато (на сайте не подписывается), work — в работе,
# review — на рассмотрении, approved — утверждено.
statuses:
  planned: ""
  work: В работе
  review: На рассмотрении
  approved: Утверждено

# Статус предмета в составе (на уровне группы или отдельной позиции):
# product — изделие производителя, custom — на заказ, tbd — подбирается.
item_statuses:
  product: Изделие производителя
  custom: На заказ
  tbd: Подбирается

# Типы изображений (подпись под кадром, если задано поле kind):
kinds:
  project: Проектная визуализация
  sketch: Эскиз
  concept: Концепт

