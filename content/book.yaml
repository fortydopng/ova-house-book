    details_title: Подробнее
    details:
      - title: Мягкая группа и телевизор
        text: "Единая угловая композиция: около пяти мест с опорой на спинку и открытый край для свободной посадки. Диван стоит с небольшим отступом от стены — 200 мм, у обрамления портала около 134 мм; это визуальный зазор, а не проход. От дивана до ближайшего журнального столика 434 мм, от глаз сидящих до экрана около 2,9 м. Между открытым концом дивана и медиатумбой 487 мм — местный интервал, не основной проход."
      - title: Проходы
        text: "Диван не заходит в проекцию проёма в холл; узкая консоль за ним входит в неё на 287 мм. Между консолью и ближайшим обеденным стулом 1118 мм. От дивана до линии остекления 1155 мм — собранные портьеры могут местами уменьшать этот запас. Вход в кладовую — из рабочей зоны кухни."
      - title: Портал и рельеф
        text: "Проём в холл получает светлую ступенчатую раму снаружи проёма — шириной 2500 мм с верхом на 2800 мм; световой проём 2100 × 2600 мм. Над рамой — поле рельефа 2300 × 1100 мм на высоте от 3,05 до 4,15 м, соразмерное высокому пространству. Диптих 2 × 600 × 1400 мм рядом связывает портал с телевизионной стеной."
      - title: Свет
        text: "Три хрустальных подвеса разной высоты образуют спокойный каскад над овальным столом; два компактных направленных светильника — над полуостровом. Подсветки цоколя, витрин и верхнего завершения кухни отделяют мебель от плоскостей комнаты, рабочая линия освещается отдельно. Общий свет, подвесы и фоновая подсветка регулируются раздельно — настроение комнаты меняется без изменения её оформления."
      - title: Окна
        text: "Высокие окна гостиной — светлые портьеры и молочный тюль на карнизе в проёме; в видах они раздвинуты максимально ради дневного света и вида на сад. Кухонное окно — компактная римская штора: поднятое полотно открывает окно и не занимает поверхность у мойки."
      - title: За окнами
        text: "Терраса — существующая, по проекту. За ней показаны предлагаемый декоративный сад, газон и лесное окружение участка. Это образ, а не фотография: точная панорама, посадки и благоустройство не выбраны."
      - title: Что уточняется до заказа
        items:
          - "Посадка: удобство мест и открытого края — пробная посадка на образцах; ткань по фабричным образцам"
          - "Портал, панели, верхний ярус кухни и стекло витрин: крепления; сервисный доступ к вытяжке и вентиляция оборудования"
          - "Свет: потолочные основания под скаты, схема питания и диммирования — по светотехническому расчёту"
          - "Винный шкаф: монтаж, вентиляция и ход двери проверяются по инструкции конкретной ревизии; ниша 400 × 860 × 620 мм"
          - "Образцы: оттенки камня, бамбукового шпона, ореха, ткани и бронзы — при дневном и вечернем свете"
          - "Не назначены: артикулы пола и облицовки камина, обеденная мебель, часть заказных элементов"
