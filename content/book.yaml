    name: Кухня-гостиная
    area: 50.73
    status: review
    plan_poly: [[3.5, 20.9], [75.3, 20.9], [75.3, 50.7], [31.0, 50.7], [31.0, 43.0], [3.5, 43.0]]
    plan_fragment: img/plan/1-08.png
    # Источник: OVA-HOUSE / 21_Pro_Render / 1.08_Кухня-гостиная — паспорт v01 и ведомость v01
    # от 13.09.2026 (M08 / S01). Кадры: OVA_R108_{A,B,C}_M08_S01_{DAY,NIGHT}_v0x.
    intent: |
      Единое пространство кухни, столовой и гостиной под высоким потолком с открытой балкой.
      Кухня в тёмном орехе с вертикальным рифлением и светлым камнем столешниц, полуостров
      с барными местами и подвесами над ним. В гостиной — диван на дубовом основании перед
      камином с телевизором, круглый стол с креслами у панорамного остекления на террасу.
      Вечером включаются встроенный свет, три кольца над столом, подвесы над полуостровом
      и скрытая подсветка рабочей поверхности и цоколя кухни.
    facts:
      - 50,73 м², Г-образный контур; кухня у западной стены, гостиная у остекления и камина
      - Потолок из двух скатов, высота от 3,95 до 5,43 м; открытая стальная балка
      - Панорамное остекление в сторону террасы и сада; проём в холл 1.04
      - Камин с коробом до потолка и собственным дымоходом; телевизор 98 дюймов
      - "Освещение по проекту: 27 встроенных светильников, 4 подвеса над полуостровом, 3 кольца над столом"
    composition_intro: "Рядом с каждым предметом — что это в жизни: изделие производителя, вещь на заказ или позиция, которая ещё подбирается."
