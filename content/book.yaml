    intent: |
      Единое пространство кухни, столовой и гостиной под высоким потолком с открытой балкой.
      Светлый камень, тёплый орех, мягкие формы и тонкая бронза. Стены — в спокойном светлом
      бамбуковом шпоне; телевизионная стена — светлая живописная композиция с деревьями, её тему
      продолжает небольшой ботанический диптих у портала. Проём в холл оформлен светлой
      ступенчатой рамой с неглубоким рельефом над ней. Единая угловая мягкая группа очерчивает
      зону общения перед телевизором и камином; овальный стол на шесть мест, кухня с молочными
      фасадами, ореховыми плоскостями и стеклянными витринами, встроенный бар с подсвеченной
      витриной. Локальный свет — три хрустальных подвеса над столом и два направленных светильника
      над полуостровом; вечером общий свет можно приглушить, оставив акценты и подсветку цоколя
      и витрин.
