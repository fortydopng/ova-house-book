    details_title: Подробнее
    details:
      - title: Мягкая группа и телевизор
        text: "Шесть мест: четыре на основном диване перед телевизором и два на втором диване у окна. От передней кромки основного дивана до экрана около 2 м, от глаз сидящих до центра экрана — 2,4–2,7 м. Со второго дивана телевизор виден под заметным углом, сбоку. Между диваном и журнальным столом 450 мм, между столом и тумбой телевизора 700 мм — это доступ к посадке, а не сквозной проход."
      - title: Проходы
        text: "Проём в холл полностью свободен от мебели. Между двумя диванами — компактный обход около 0,7 м. Круглый стол со стульями отодвинут от остекления на 0,4 м, чтобы освободить подход к двери на террасу. Пути от входа к телевизору, бару и террасной двери проверены по плану при показанной расстановке."
      - title: Высокое окно
        text: "Два независимых ряда на карнизах внутри откоса: спереди светлые матовые портьеры мягкой волной, сзади молочный полупрозрачный тюль. В раскрытом состоянии ткань собрана у краёв примерно по 450 мм с каждой стороны, середина остекления — около 2,6 м из 3,5 — остаётся открытой; окно при этом не увеличивается. Полотна до пола, без шлейфа."
      - title: Кухонное окно
        text: "Три отдельные рулонные screen-шторы по секциям окна. Ровная светлая ткань спокойнее рядом с росписью и ореховыми шкафами и собирает меньше кухонных загрязнений, чем римская штора; полотна подняты, у мойки и смесителя нет свободной ткани. Обе оконные ткани прозрачные: вечером при включённом свете они не заменяют ночную приватность, полное затемнение не предусмотрено."
      - title: За окнами
        text: "Терраса — существующая, по проекту. За ней показаны предлагаемый декоративный сад, газон и лесное окружение участка; вид направлен примерно на северо-запад. Это образ, а не фотография: точная панорама, посадки и благоустройство не выбраны, бассейн и другие объекты плана участка в фон не добавлены."
      - title: Что уточняется до заказа
        items:
          - "Посадка: полезная ширина мест, низкие спинки и угол обзора со второго дивана — пробная посадка на образцах"
          - "Камин: расстояние от мягкой мебели и штор до топки проверяется по требованиям её изготовителя"
          - "Роспись: обмер стен и единый макет на все поверхности, без белых полос у камина и торца бара; пробный фрагмент"
          - "Образцы: молочный лак фасадов, ткани обоих диванов, шпон, камень и металл — при дневном и вечернем свете"
          - "Холодильник: ниша и открывание дверей проверяются обмером после отделки — боковой запас на пределе"
          - "Свет и стекло: крепления трёх каскадных светильников (54 кг), подсветка кухни, безопасное стекло и опоры столика — расчёт изготовителей"
    references_intro: Какие приёмы из подборки легли в основу помещения — взят приём, а не чужая комната.
    references:
      - { id: REF-017, note: "Палитра: молочный, орех, светлый камень и тёплый металл." }
