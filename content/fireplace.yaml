# Камин в кухне-гостиной 1.08 — уточнённое направление: чёрный глянцевый керамогранит, золото, серебро, зеркала.
# Основная страница docs/fireplace/. Ранние направления (К-01…К-45) — content/fireplace_earlier.yaml → docs/fireplace/earlier/.
# Изображения: python ingest.py fireplace 1 k-NN-M.png ... → docs/img/fireplace/v1/, затем python crop_fireplace.py.
# Порядок на странице — от тихого к смелому (группы «Ядро направления» → «Заметнее» → «На максимум» → светлый камень);
# новые серии всегда идут отдельными вариантами, а не исполнениями похожих старых. Нумерация К-NN сквозная; следующий — К-80.

