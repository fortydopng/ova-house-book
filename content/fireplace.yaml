# Камин в кухне-гостиной 1.08 — варианты оформления для обсуждения с хозяином.
# Страница docs/fireplace/. Изображения: python ingest.py fireplace 1 k-01-1.png ... → docs/img/fireplace/v1/.
# Нумерация К-01…К-16 постоянная: новые варианты продолжают её, исполнения внутри варианта нумеруются с 1.

fireplace:
  slug: fireplace
  title: "Камин: варианты оформления"
  subtitle: Кухня-гостиная 1.08
  room: "1.08"
  version: 4
  date: 2026-09-25
  img_version: 1
  intro: |
    Все варианты показаны на одном и том же виде: стена с камином и телевизором в кухне-гостиной,
    дневной свет; первая группа — вечером, чтобы был виден свет. Меняется оформление камина — комната, роспись на телевизионной стене и мебель
    остаются как в текущей версии помещения. В части исполнений изменилась и стена рядом
    с камином, не показан телевизор или свет вечерний; это особенности эскиза, а не предложения
    по комнате — там, где это так, сказано в описании варианта.

    Это эскизы для выбора направления, а не проектные решения. Рисунок камня, размеры, стыки и способ
    крепления уточняются после того, как направление выбрано; топка и дымоход — по проекту.
  how_to: >
    Варианты идут один за другим сверху вниз. Внутри варианта несколько исполнений — их листают вбок;
    в ленте показана часть вида с камином, нажатие открывает весь вид на экран. Чтобы ответить,
    достаточно назвать номер варианта и исполнения, например «К-06, третье».
  home_lead: Направления оформления камина на одном виде — для выбора направления, не для заказа.
  home_strip: [k-41-1, k-40-1, k-45-1, k-30-1, k-17-1, k-08-1, k-29-1, k-01-1]
  questions_title: Что поможет выбрать
  questions:
    - Камень спокойный или с выразительным рисунком?
    - Подсветка изнутри — да или нет?
    - "Плоскость или объём: гладкая плита, рельеф или скульптура?"
    - "Металл в обрамлении: тёмная патинированная бронза, светлая бронза или без металла?"
    - Полка над топкой — нужна ли?
    - Движущийся свет над топкой (К-40…К-42) — интересно ли это направление?
  source_note: >
    Эскизы подготовлены 25 сентября 2026 года на основе текущей версии кухни-гостиной 1.08.
    Ни один из вариантов не согласован к заказу; выбранное направление будет проработано в размерах и материалах.

  groups:
    - id: glass
      name: Стекло, зеркало и движущийся свет
      note: >
        Верхнее поле над каменным основанием — стекло или зеркало, по которому вечером медленно поднимается свет.
        Движение создаёт отдельный электрический свет, а не пламя топки; каменное основание, топка и полка сохраняются.
        Показан вечерний режим (К-45 — днём); яркость и характер движения проверяются на рабочем образце.
      variants:
        - id: К-40
          slug: k-40
          title: "Золотая вуаль: матовое стекло и проекция света"
          text: >
            Матированное стекло с узкими зеркальными кромками; на панель проецируется медленное золотое течение
            света в оттенках шампанского, без буквальных языков пламени. Ближе всего к ощущению «свет огня
            поднимается по панели». Проектор — отдельный прибор в стороне от камина.
          images: [k-40-1]
        - id: К-41
          slug: k-41
          title: "Кристаллический подъём: стеклянная световая панель"
          text: >
            Вертикальный рисунок из гранёных стеклянных модулей на светлом отражающем фоне; скрытые тёплые
            источники на нескольких уровнях включаются последовательно, и блики поднимаются вверх. Днём главным
            остаётся стекло и отражения, вечером — контраст. Самый выразительный из трёх.
          images: [k-41-1]
        - id: К-42
          slug: k-42
          title: "Зеркальная глубина: два световых канала"
          text: >
            Спокойная зеркальная плоскость и два узких боковых канала с многократными отражениями света,
            уходящими в глубину. Самый строгий и архитектурный из трёх; по характеру движения меньше похож на огонь.
          images: [k-42-1]
        - id: К-45
          slug: k-45
          title: Гранёное стекло с подсветкой
          text: >
            Верхнее поле из крупных гранёных стеклянных элементов с тёплой подсветкой изнутри — статичная
            стеклянная плита без движущегося света, показана днём. Тумба под телевизором здесь тоже стеклянная.
          images: [k-45-1, k-45-2, k-45-3, k-45-4]

    - id: stone
      name: Камень с рисунком
      note: Камень как главный материал — рисунок и цвет плиты задают характер камина.
      variants:
        - id: К-01
          slug: k-01
          title: Светлый мрамор с бордовыми прожилками и полкой
          text: >
            Панели тёплого светлого мрамора с тёмно-бордовым рисунком на всю высоту; над топкой — тонкая
            бронзовая полка с подсветкой, в одном исполнении вместо неё — узкая зеркальная вставка.
            Исполнения различаются раскладкой панелей и решением под полкой.
          images: [k-01-1, k-01-2, k-01-3, k-01-4, k-01-5]
        - id: К-02
          slug: k-02
          title: Светлый камень с золотыми прожилками
          text: >
            Тот же приём с полкой, но камень спокойнее по тону: светлое поле и тонкие
            золотисто-коричневые жилы, сходящиеся зеркально.
          images: [k-02-1, k-02-2]
        - id: К-03
          slug: k-03
          title: Оливково-серый камень с прожилками
          text: >
            Более плотный и тёмный камень в оливково-серых тонах — ближе к зелёному мрамору из подборки,
            но в спокойной палитре дома.
          images: [k-03-1, k-03-2, k-03-3]
        - id: К-04
          slug: k-04
          title: Крупный рисунок камня с тёмными жилами
          text: >
            Выразительная плита с широким рисунком и грубо колотым основанием.
            Самый контрастный из каменных вариантов.
          images: [k-04-1, k-04-2, k-04-3, k-04-4, k-04-5]
        - id: К-05
          slug: k-05
          title: Мрамор с бордовыми прожилками и бронзовая рама топки
          text: >
            Камень как в К-01, но без полки: акцент переносится на широкую раму топки
            из патинированной бронзы.
          images: [k-05-1, k-05-2]

        - id: К-17
          slug: k-17
          title: Зелёный мрамор, зеркальный раскрой
          text: >
            Зелёный мрамор с тёмными жилами, сходящимися зеркально по оси плиты; цоколь-лавка из того же камня.
            Ближе всего к зелёному камину из подборки.
          images: [k-17-1, k-17-2, k-17-3, k-17-4]
        - id: К-18
          slug: k-18
          title: "Зелёный камень: узкая плита или вся стена"
          text: >
            Тот же зелёный камень в двух постановках: узкая плита рядом с росписью — и камень, продолжающийся
            за телевизор на всю стену. Единственный вариант, где меняется не только камин, но и композиция стены.
          images: [k-18-1, k-18-2, k-18-3, k-18-4]
        - id: К-19
          slug: k-19
          title: Приглушённый оливковый камень
          text: >
            Светло-оливковый камень с тонкими тёмными жилами — зелёный мотив в самой спокойной подаче.
          images: [k-19-1]
        - id: К-20
          slug: k-20
          title: Кварцит Патагония, тёмно-зелёный
          text: >
            Тёмно-зелёный кварцит с белыми и золотистыми включениями, зеркальный раскрой;
            самый насыщенный по цвету из зелёных.
          images: [k-20-1, k-20-2, k-20-3, k-20-4]
        - id: К-21
          slug: k-21
          title: Золотисто-коричневый мрамор, зеркальный раскрой
          text: >
            Светлый мрамор с широкими золотисто-коричневыми жилами, сходящимися в форме буквы Х —
            рисунок-«молния» без подсветки. В одном исполнении телевизор не показан.
          images: [k-21-1, k-21-2, k-21-3, k-21-4]
        - id: К-22
          slug: k-22
          title: Молочный камень с коричневыми жилами
          text: >
            Молочно-белый камень с коричневыми ветвящимися жилами — древовидный рисунок или сетка;
            во втором исполнении стена рядом показана без росписи.
          images: [k-22-1, k-22-2]
        - id: К-23
          slug: k-23
          title: "Бордовые прожилки: матовые панели"
          text: >
            Мрамор с бордовыми прожилками, матовая поверхность, спокойная раскладка панелями без полки.
            Во втором исполнении телевизор не показан.
          images: [k-23-1, k-23-2]
        - id: К-24
          slug: k-24
          title: "Бордовые прожилки: единая зеркальная плита"
          text: >
            Один зеркальный раскрой на всю высоту вместо панелей; телевизор в этих исполнениях не показан.
          images: [k-24-1, k-24-2, k-24-3, k-24-4]
        - id: К-25
          slug: k-25
          title: Бордовые прожилки с зеркальными вставками
          text: >
            В плиту врезаны узкие вертикальные зеркальные полосы в тонкой бронзовой окантовке;
            телевизор не показан.
          images: [k-25-1, k-25-2, k-25-3, k-25-4]
        - id: К-26
          slug: k-26
          title: Бордовые прожилки с горизонтальными вставками
          text: >
            Плита разделена узкими тёмными горизонтальными вставками; линия продолжается на тумбе.
          images: [k-26-1, k-26-2, k-26-3]
        - id: К-27
          slug: k-27
          title: Бордовые прожилки в светлой раме
          text: >
            Верх камина — мрамор с прожилками, топка в гладкой светлой раме; роспись на стене
            в этих исполнениях другая — с высокими деревьями.
          images: [k-27-1, k-27-2, k-27-3, k-27-4]
        - id: К-28
          slug: k-28
          title: Тигровый полосатый камень
          text: >
            Тёмно-коричневый камень с плотными горизонтальными полосами — «тигровый» рисунок;
            самый тёмный из каменных вариантов.
          images: [k-28-1, k-28-2, k-28-3, k-28-4]

    - id: light
      name: Свет изнутри
      note: Камень с подсветкой изнутри — камин заметен и днём, и вечером.
      variants:
        - id: К-06
          slug: k-06
          title: Оникс с подсветкой, янтарный
          text: >
            Полупрозрачный оникс с подсветкой изнутри: камень светится тёплым янтарным светом,
            рисунок жил читается насквозь. В части исполнений — цельная плита с каменной лавкой,
            в части — раскладка панелями и полка.
          images: [k-06-1, k-06-2, k-06-3, k-06-4, k-06-5, k-06-6, k-06-7, k-06-8]
        - id: К-07
          slug: k-07
          title: Оникс с подсветкой, молочный
          text: >
            Та же подсветка изнутри, но камень светлый и почти однородный — мягкое свечение
            вместо рисунка. Самый тихий из светящихся вариантов.
          images: [k-07-1, k-07-2, k-07-3, k-07-4]

        - id: К-29
          slug: k-29
          title: Светлый камень с одной светящейся жилой
          text: >
            Молочный камень с единственной жилой, подсвеченной изнутри — приём «молнии» из подборки
            в светлой палитре дома. В одном исполнении стена рядом показана без росписи.
          images: [k-29-1, k-29-2, k-29-3, k-29-4]
        - id: К-30
          slug: k-30
          title: Медовый оникс с подсветкой
          text: >
            Полупрозрачный медовый оникс с красно-коричневой сеткой жил; подсветка изнутри делает
            рисунок главным событием стены.
          images: [k-30-1, k-30-2, k-30-3, k-30-4]
        - id: К-31
          slug: k-31
          title: Тёмный камень со светящейся трещиной
          text: >
            Тёмный дымчатый камень с подсвеченной трещиной по всей высоте — вечерний, контрастный вариант.
          images: [k-31-1, k-31-2, k-31-3, k-31-4]
        - id: К-32
          slug: k-32
          title: Оникс с подсветкой в тёмной раме
          text: >
            Светящаяся плита оникса в широкой раме из тёмного камня. Здесь изменилась и комната —
            тёмные стены и вечернее окно; показан только приём, не предложение по комнате.
          images: [k-32-1, k-32-2, k-32-3, k-32-4]
        - id: К-43
          slug: k-43
          title: Кристаллический кварц с подсветкой
          text: >
            Полупрозрачный светлый кварц с крупной кристаллической структурой и подсветкой изнутри —
            свечение сильнее и холоднее, чем у молочного оникса К-07; рисунок — крупные светлые кристаллы.
          images: [k-43-1, k-43-2, k-43-3, k-43-4]
        - id: К-44
          slug: k-44
          title: Светлый камень с двумя световыми каналами
          text: >
            Дневной родственник К-42: гладкий светлый мрамор с двумя узкими вертикальными световыми
            каналами в тонкой бронзовой окантовке.
          images: [k-44-1, k-44-2]

    - id: relief
      name: Рельеф и скульптура
      note: Объёмная композиция вместо гладкой плоскости.
      variants:
        - id: К-08
          slug: k-08
          title: Резное дерево в светлом камне
          text: >
            Рельеф с деревом, вырезанный в светлом камне тон в тон — продолжение темы
            телевизионной стены в объёме.
          images: [k-08-1, k-08-2, k-08-3, k-08-4]
        - id: К-09
          slug: k-09
          title: Бронзовое дерево на тёмном поле
          text: >
            Скульптурное дерево из бронзы на тёмном матовом фоне — самый заметный из вариантов,
            особенно вечером. В части исполнений роспись на телевизионной стене показана ровной стеной.
          images: [k-09-1, k-09-2, k-09-3, k-09-4, k-09-5, k-09-6, k-09-7, k-09-8]

    - id: texture
      name: Фактуры
      note: Природная или металлическая фактура крупным планом.
      variants:
        - id: К-11
          slug: k-11
          title: Кап дерева, зеркальный раскрой
          text: >
            Портал из капа тёмного дерева с зеркальным рисунком, топка в светлом камне.
            Самый тёплый по цвету и самый тяжёлый по массе.
          images: [k-11-1, k-11-2, k-11-3, k-11-4, k-11-5, k-11-6, k-11-7, k-11-8]
        - id: К-12
          slug: k-12
          title: Рифлёные светлые панели и каменная лавка
          text: >
            Вертикальные рифлёные панели в тон стене; камень остаётся только в лавке,
            проходящей под телевизором. В части исполнений рифление переходит и на стену за телевизором,
            телевизор не показан.
          images: [k-12-1, k-12-2, k-12-3, k-12-4, k-12-5, k-12-6]
        - id: К-13
          slug: k-13
          title: Тёмная бронза, рифлёная
          text: >
            Вертикальные рифлёные панели из тёмной патинированной бронзы — металл вместо камня.
          images: [k-13-1, k-13-2, k-13-3, k-13-4]

        - id: К-34
          slug: k-34
          title: Выветренное дерево над светлым камнем
          text: >
            Верх из выветренных тёмных досок, низ с топкой — гладкий светлый камень.
          images: [k-34-1, k-34-2, k-34-3, k-34-4]
        - id: К-35
          slug: k-35
          title: Чёрное стекло в латунной раме
          text: >
            Глянцевые чёрные панели в латунной окантовке; телевизор в этих исполнениях не показан.
          images: [k-35-1, k-35-2, k-35-3, k-35-4]
        - id: К-36
          slug: k-36
          title: Светлый камень в рифлёной раме
          text: >
            Плита в обрамлении из вертикальных полукруглых валиков; в двух исполнениях внутри —
            мрамор с прожилками.
          images: [k-36-1, k-36-2, k-36-3, k-36-4]

    - id: calm
      name: Спокойные варианты
      note: Тихие решения — камин остаётся частью стены, а не её центром.
      variants:
        - id: К-14
          slug: k-14
          title: Светлый камень, панели с тонкими бронзовыми линиями
          text: >
            Светлый камень со слабым рисунком, разделённый тонкими бронзовыми линиями на панели.
          images: [k-14-1, k-14-2, k-14-3, k-14-4]
        - id: К-15
          slug: k-15
          title: Спокойный светлый камень с тёмными вставками
          text: >
            Почти однородный светлый камень; ритм задают две узкие тёмные горизонтальные вставки
            и линия тумбы.
          images: [k-15-1, k-15-2]
        - id: К-16
          slug: k-16
          title: Светлый камень в обрамлении и полка
          text: >
            Светлое поле камня с вертикальным обрамлением по сторонам — тёмным или бронзовым —
            и полкой над топкой. Исполнения различаются материалом обрамления и формой полки.
          images: [k-16-1, k-16-2, k-16-3, k-16-4, k-16-5, k-16-6, k-16-7, k-16-8]
        - id: К-37
          slug: k-37
          title: Гладкий светлый камень без рисунка
          text: >
            Ровная светлая поверхность без рисунка, с низкой лавкой; во втором исполнении телевизор не показан.
          images: [k-37-1, k-37-2]
        - id: К-38
          slug: k-38
          title: Светлый камень с латунной геометрией
          text: >
