# Камин в кухне-гостиной 1.08 — уточнённое направление: чёрный глянцевый керамогранит, золото, серебро, зеркала.
# Основная страница docs/fireplace/. Ранние направления (К-01…К-45) — content/fireplace_earlier.yaml → docs/fireplace/earlier/.
# Изображения: python ingest.py fireplace 1 k-46-1.png ... → docs/img/fireplace/v1/, затем python crop_fireplace.py.
# Нумерация К-46… продолжает сквозную нумерацию ранних направлений; исполнения внутри варианта — с 1.

fireplace:
  slug: fireplace
  title: "Камин: варианты оформления"
  subtitle: Кухня-гостиная 1.08
  room: "1.08"
  version: 1
  date: 2026-09-26
  img_version: 1
  links:
    - { title: "Ранние направления", url: "fireplace/earlier/", text: "43 варианта К-01…К-45, собранные до уточнения задачи" }
  intro: |
    Уточнённое направление: чёрный глянцевый керамогранит крупного формата, к нему — золото, серебро
    или зеркало. Все варианты показаны на одном и том же виде: стена с камином и телевизором
    в кухне-гостиной, дневной свет; комната, роспись на телевизионной стене и мебель остаются
    как в текущей версии помещения.

    Принцип отбора: один металл на вариант; золото приглушённое, оттенка шампань, сатиновое; серебро
    тёплое — брашированная сталь или никель; металл как линия, а не как поверхность; зеркало
    тонированное. Несколько вариантов нарочно сделаны на максимум — полированное золото, прозрачное
    зеркало, два металла вместе, — чтобы была видна граница. В конце для сравнения те же металлы
    и зеркала на светлом камне.

    Это эскизы для выбора направления, а не проектные решения: артикул керамогранита, раскладка,
    размеры и узлы уточняются после выбора; топка и дымоход — по проекту.
  how_to: >
    Варианты идут один за другим сверху вниз. Внутри варианта несколько исполнений — их листают вбок;
    в ленте показана часть вида с камином, нажатие открывает весь вид на экран. Чтобы ответить,
    достаточно назвать номер варианта и исполнения, например «К-48, третье».
  home_lead: Уточнённое направление — чёрный глянец с золотом, серебром или зеркалом. Ранние направления сохранены на отдельной странице.
  home_strip: [k-46-1, k-48-1, k-58-1, k-54-1, k-49-1, k-60-1, k-62-1, k-55-1]
  questions_title: Что поможет выбрать
  questions:
    - Золото или серебро — что ближе?
    - "Металл как тонкая линия или как рама вокруг топки?"
    - "Зеркало: тонированное, прозрачное — или без зеркала?"
    - Чёрный камень с жилами или ровный чёрный глянец?
    - Светлый камень с теми же металлами — как альтернатива чёрному?
  source_note: >
    Эскизы подготовлены 26 сентября 2026 года на основе текущей версии кухни-гостиной 1.08.
    Ни один из вариантов не согласован к заказу; выбранное направление будет проработано в размерах и материалах.

  groups:
    - id: gold
      name: Чёрный глянец и золото
      note: Золото только оттенка шампань и только как линия, рамка или жилы камня; два варианта сделаны на максимум.
      variants:
        - id: К-46
          slug: k-46
          title: Чёрный камень с золотыми жилами и тонкая золотая рамка
          text: >
            Крупноформатный чёрный глянец с золотыми жилами в духе мрамора Порторо, зеркальный раскрой;
            топка в тонкой рамке сатинового золота. Золото — только в жилах камня и в этой рамке.
          images: [k-46-1, k-46-2, k-46-3, k-46-4]
        - id: К-47
          slug: k-47
          title: Чёрный камень с золотыми жилами, без металла
          text: >
            Тот же чёрно-золотой камень, но металла нет вовсе — золото даёт только рисунок жил.
            В двух исполнениях телевизор не показан.
          images: [k-47-1, k-47-2, k-47-3, k-47-4]
        - id: К-48
          slug: k-48
          title: Чёрный глянец и одна золотая линия
          text: >
            Ровный чёрный глянец и единственная вертикальная линия сатинового золота на всю высоту.
            Исполнения различаются камнем — ровный чёрный или с белыми жилами — и рамой топки.
          images: [k-48-1, k-48-2, k-48-3, k-48-4, k-48-5, k-48-6]
        - id: К-49
          slug: k-49
          title: Золотая поталь под стеклом
          text: >
            Низ — чёрный глянец, верхнее поле — состаренная золотая поталь под стеклом, приглушённая,
            с тёмными облаками патины; тёплое сияние вместо блеска металла.
          images: [k-49-1, k-49-2, k-49-3, k-49-4]
        - id: К-50
          slug: k-50
          title: Рифлёная сатиновая полоса оттенка шампань
          text: >
            Чёрный глянец и узкая рифлёная полоса светлого металла оттенка шампань вдоль края колонны;
            единственный объёмный металл среди золотых вариантов.
          images: [k-50-1, k-50-2, k-50-3, k-50-4]
        - id: К-51
          slug: k-51
          title: Чёрный камень в полированных золотых рамах
          text: >
            Чёрный камень с жилами, верхнее поле и топка в многослойных рамах полированного золота.
            Самый золотой из вариантов — показан как верхняя граница.
          images: [k-51-1, k-51-2, k-51-3, k-51-4]
        - id: К-52
          slug: k-52
          title: Чёрный глянец и золотые рифлёные стойки
          text: >
            Вертикальные полированные золотые стойки в верхнем поле и золотая рама топки на чёрном глянце.
          images: [k-52-1, k-52-2, k-52-3, k-52-4]
        - id: К-53
          slug: k-53
          title: Чёрный камень с золотыми жилами и широкая золотая рама
          text: >
            Как К-46, но рама топки шире и полированная. В двух исполнениях телевизор не показан.
          images: [k-53-1, k-53-2, k-53-3, k-53-4]

    - id: silver
      name: Чёрный глянец и серебро
      note: Серебро тёплое — брашированная сталь и никель, без холодного хрома.
      variants:
        - id: К-54
          slug: k-54
          title: Чёрный глянец и брашированная сталь
          text: >
            Рама топки и тонкие раскладки из брашированной стали тёплого оловянного оттенка;
            без золота и без хрома.
          images: [k-54-1, k-54-2, k-54-3, k-54-4]
        - id: К-55
          slug: k-55
          title: Серебряная поталь под дымчатым стеклом
          text: >
            Верхнее поле — состаренная серебряная поталь под дымчатым стеклом, серое мерцание,
            темнеющее к краям; низ — чёрный глянец.
          images: [k-55-1, k-55-2, k-55-3, k-55-4]
        - id: К-56
          slug: k-56
          title: Рифлёный никель
          text: >
            Серебряная пара к К-50: узкая рифлёная полоса брашированного никеля вдоль чёрной колонны.
          images: [k-56-1, k-56-2, k-56-3, k-56-4]
        - id: К-57
          slug: k-57
          title: Чёрный камень с белыми жилами и стальная рама
          text: >
            Чёрный мрамор с белыми жилами и широкая рама топки из полированной стали.
          images: [k-57-1, k-57-2, k-57-3, k-57-4]

    - id: mirror
      name: Чёрный глянец и зеркала
      note: Зеркало тонированное — бронзовое или дымчатое; прозрачное показано один раз как граница.
      variants:
        - id: К-58
          slug: k-58
          title: Бронзовое зеркало
          text: >
            Верхнее поле — зеркало с бронзовой тонировкой в тонкой раскладке, отражает тёплую комнату;
            низ — чёрный глянец.
          images: [k-58-1, k-58-2, k-58-3, k-58-4]
        - id: К-59
          slug: k-59
          title: Зеркальные каналы
          text: >
            Чёрная колонна с узкими вертикальными каналами дымчатого зеркала по краям; центр — чёрный глянец.
          images: [k-59-1, k-59-2, k-59-3, k-59-4]
        - id: К-60
          slug: k-60
          title: Серое зеркало с золотой линией
          text: >
            Узкая вставка дымчатого зеркала над топкой в тонкой золотой окантовке. Единственный вариант,
            где чёрный, зеркало и золото встречаются вместе — в пропорции 80 / 15 / 5.
          images: [k-60-1, k-60-2, k-60-3, k-60-4]
        - id: К-61
          slug: k-61
          title: Прозрачное зеркало в золотой раме на чёрном камне
          text: >
            Чёрный мрамор с жилами и большое прозрачное зеркало в золотой раме в верхнем поле.
          images: [k-61-1, k-61-2, k-61-3, k-61-4]

    - id: black
      name: Чёрный без металла
      note: Точка отсчёта — сколько даёт сам чёрный глянец, прежде чем добавлять металл.
      variants:
        - id: К-62
          slug: k-62
          title: Чёрный монолит
          text: >
            Цельный чёрный глянец, колонна и цоколь вместе; металла почти нет — только тонкая кромка.
          images: [k-62-1, k-62-2, k-62-3, k-62-4]
        - id: К-63
          slug: k-63
          title: "Чёрный: полосы и линии"
          text: >
            Чёрный глянец, разделённый тонкими светлыми линиями на вертикальные полосы;
            рисунок из блеска и линий, а не из материалов.
          images: [k-63-1, k-63-2, k-63-3, k-63-4]

    - id: cream
      name: Светлый камень с металлом и зеркалом
      note: Те же металлы и зеркала на светлом камне — для сравнения с чёрным.
      variants:
        - id: К-64
          slug: k-64
          title: Светлый мрамор и стальная рама топки
          text: >
            Светлый мрамор с золотистыми жилами; топка в широкой раме из полированной стали.
          images: [k-64-1, k-64-2, k-64-3, k-64-4]
        - id: К-65
          slug: k-65
          title: Светлый мрамор и золотая рама топки
          text: >
            Тот же светлый мрамор; топка в раме полированного золота.
          images: [k-65-1, k-65-2, k-65-3, k-65-4]
        - id: К-66
          slug: k-66
          title: Светлый мрамор и рама из двух металлов
          text: >
            Рама топки из золота и стали вместе — проверка, уживаются ли два металла рядом.
          images: [k-66-1, k-66-2, k-66-3, k-66-4]
        - id: К-67
          slug: k-67
          title: Зеркало в золотой раме на светлом камне
          text: >
            Прямоугольное зеркало в золотой раме над топкой; исполнения различаются шириной и профилем рамы.
          images: [k-67-1, k-67-2, k-67-3]
        - id: К-68
          slug: k-68
          title: Зеркало в серебряной раме на светлом камне
          text: >
            Прямоугольное зеркало в серебряной раме над топкой. Телевизор в этих исполнениях не показан.
          images: [k-68-1, k-68-2, k-68-3, k-68-4]
        - id: К-69
          slug: k-69
          title: Зеркальная раскладка на светлом камне
          text: >
            Верхнее поле — зеркало в мелкой раскладке со светлыми переплётами.
          images: [k-69-1, k-69-2, k-69-3, k-69-4]
