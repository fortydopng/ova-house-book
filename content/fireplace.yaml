  og_description: "Варианты оформления камина в кухне-гостиной: чёрный глянцевый керамогранит с золотом, серебром или зеркалом — от тихого к смелому."
  links:
    - { title: "Ранние направления", url: "fireplace/earlier/", text: "43 варианта К-01…К-45, собранные до уточнения задачи" }
  intro: |
    Уточнённое направление: чёрный глянцевый керамогранит крупного формата, к нему — золото, серебро
    или зеркало. Все варианты показаны на одном и том же виде: стена с камином и телевизором
    в кухне-гостиной, дневной свет; комната, роспись на телевизионной стене и мебель остаются
    как в текущей версии помещения.

    Варианты расставлены от самого тихого к самому смелому. Принцип отбора: один металл на вариант;
    золото приглушённое, оттенка шампань, сатиновое; серебро тёплое — брашированная сталь или никель;
    металл как линия, а не как поверхность; зеркало тонированное. Несколько вариантов нарочно
    сделаны на максимум — полированное золото, прозрачное зеркало, два металла вместе, — чтобы была
    видна граница. В конце для сравнения те же металлы и зеркала на светлом камне.

    Это эскизы для выбора направления, а не проектные решения: артикул керамогранита, раскладка,
    размеры и узлы уточняются после выбора; топка и дымоход — по проекту.
  how_to: >
    Варианты идут один за другим сверху вниз. Внутри варианта несколько исполнений — их листают вбок;
    в ленте показана часть вида с камином, нажатие открывает весь вид на экран. Чтобы ответить,
    достаточно назвать номер варианта и исполнения, например «К-48, третье».
  home_lead: Уточнённое направление — чёрный глянец с золотом, серебром или зеркалом, от тихого к смелому. Ранние направления сохранены на отдельной странице.
  home_strip: [k-70-1, k-62-1, k-46-1, k-72-1, k-58-1, k-74-1, k-54-1, k-49-1]
  questions_title: Что поможет выбрать
  questions:
    - Золото или серебро — что ближе?
    - "Металл как тонкая линия или как рама вокруг топки?"
    - "Зеркало: тонированное, прозрачное — или без зеркала?"
    - Чёрный камень с жилами или ровный чёрный глянец?
    - Светлый камень с теми же металлами — как альтернатива чёрному?
  source_note: >
    Эскизы подготовлены 26 сентября 2026 года на основе текущей версии кухни-гостиной 1.08.
    Ни один из вариантов не согласован к заказу; выбранное направление будет проработано в размерах и материалах.

  groups:
    - id: core
      name: Ядро направления
      note: >
        От самого тихого к чуть более заметному: чёрный глянец и один акцент — линия, рамка, жилы камня, тонированное зеркало или поталь. В вариантах К-70…К-79 чёрная полка проходит под всей тумбой, а рисунок камня взят из реальных коллекций керамогранита.
      variants:
        - id: К-62
          slug: k-62
          title: Чёрный монолит
          text: >
            Цельный чёрный глянец, колонна и цоколь вместе; металла почти нет — только тонкая кромка.
          images: [k-62-1, k-62-2, k-62-3, k-62-4]
        - id: К-70
          slug: k-70
          title: Тонкая рамка топки оттенка шампань
          text: >
            Почти однородный чёрный глянец; единственный акцент — тонкая замкнутая рамка шампань вокруг топки,
            высокая плоскость остаётся свободной. Керамогранит Ariostea Ultra Iridium Nero, полированный.
          images: [k-70-1]
        - id: К-46
          slug: k-46
          title: Чёрный камень с золотыми жилами и тонкая золотая рамка
          text: >
            Крупноформатный чёрный глянец с золотыми жилами в духе мрамора Порторо, зеркальный раскрой; топка в
            тонкой рамке сатинового золота. Золото — только в жилах камня и в этой рамке.
          images: [k-46-1, k-46-2, k-46-3, k-46-4]
        - id: К-73
          slug: k-73
          title: Чёрный с белыми жилами и кант шампань
          text: >
            Atlas Plan Nero Marquina, полированный: белые прожилки и тонкий тёплый кант по контуру, стыку и
            рамке топки; прожилки продолжаются на полке.
          images: [k-73-1]
        - id: К-71
          slug: k-71
          title: Чёрный Laurent с золотистыми жилами
          text: >
            Florim Marble Laurent, зеркальный глянец: тёплые золотистые жилы — рисунок самого керамогранита,
            отдельного металла нет.
          images: [k-71-1]
        - id: К-48
          slug: k-48
          title: Чёрный глянец и одна золотая линия
          text: >
            Ровный чёрный глянец и единственная вертикальная линия сатинового золота на всю высоту. Исполнения
            различаются камнем — ровный чёрный или с белыми жилами — и рамой топки.
          images: [k-48-1, k-48-2, k-48-3, k-48-4, k-48-5, k-48-6]
        - id: К-72
          slug: k-72
          title: Одна золотая вертикаль
          text: >
            Ariostea Ultra Iridium Nero: почти однородный чёрный глянец и одна тонкая золотая линия от потолка
            до горизонтального стыка; низ и полка чистые.
          images: [k-72-1]
        - id: К-58
          slug: k-58
          title: Бронзовое зеркало
          text: >
            Верхнее поле — зеркало с бронзовой тонировкой в тонкой раскладке, отражает тёплую комнату; низ —
            чёрный глянец.
          images: [k-58-1, k-58-2, k-58-3, k-58-4]
        - id: К-74
          slug: k-74
          title: Зеркальный кант у левого края
          text: >
            Узкая светлая зеркальная вставка у левого края верхней плиты отражает окно и подчёркивает глубину
            чёрного; низ и полка — чистый чёрный глянец.
          images: [k-74-1]
        - id: К-54
          slug: k-54
          title: Чёрный глянец и брашированная сталь
          text: >
            Рама топки и тонкие раскладки из брашированной стали тёплого оловянного оттенка; без золота и без
            хрома.
          images: [k-54-1, k-54-2, k-54-3, k-54-4]
        - id: К-75
          slug: k-75
          title: Nero Greco и серебристый контур
          text: >
            Laminam Nero Greco, полированный: серо-белые прожилки и тонкий нейтрально-серебристый контур; полка
            в том же рисунке.
          images: [k-75-1]
        - id: К-76
          slug: k-76
          title: Полоса сатинированного никеля
          text: >
            Узкая вертикальная полоса шлифованного серебристого металла у левого края верхней плиты на ровном
            чёрном глянце.
          images: [k-76-1]
        - id: К-49
          slug: k-49
          title: Золотая поталь под стеклом
          text: >
            Низ — чёрный глянец, верхнее поле — состаренная золотая поталь под стеклом, приглушённая, с тёмными
            облаками патины; тёплое сияние вместо блеска металла.
          images: [k-49-1, k-49-2, k-49-3, k-49-4]
        - id: К-55
          slug: k-55
          title: Серебряная поталь под дымчатым стеклом
          text: >
            Верхнее поле — состаренная серебряная поталь под дымчатым стеклом, серое мерцание, темнеющее к
            краям; низ — чёрный глянец.
          images: [k-55-1, k-55-2, k-55-3, k-55-4]
        - id: К-59
          slug: k-59
          title: Зеркальные каналы
          text: >
            Чёрная колонна с узкими вертикальными каналами дымчатого зеркала по краям; центр — чёрный глянец.
          images: [k-59-1, k-59-2, k-59-3, k-59-4]
        - id: К-77
          slug: k-77
          title: Две дымчатые зеркальные вставки
          text: >
            Две симметричные вертикальные вставки от потолка до участка над стыком; между ними остаётся широкое
            чёрное поле.
          images: [k-77-1]
        - id: К-60
          slug: k-60
          title: Серое зеркало с золотой линией
          text: >
            Узкая вставка дымчатого зеркала над топкой в тонкой золотой окантовке. Единственный вариант, где
            чёрный, зеркало и золото встречаются вместе — в пропорции 80 / 15 / 5.
          images: [k-60-1, k-60-2, k-60-3, k-60-4]
        - id: К-78
          slug: k-78
          title: Зеркальная вставка с кантом шампань
          text: >
            Небольшой вытянутый горизонтальный прямоугольник зеркала в верхней части монолита с тонкой тёплой
            рамкой.
          images: [k-78-1]
        - id: К-79
          slug: k-79
          title: Тонкая геометрия ар-деко
          text: >
            Один тонкий серебристый контур со ступенчатыми верхними углами на верхней плите; поля внутри и
            вокруг остаются свободными.
          images: [k-79-1]

    - id: more
      name: Заметнее
      note: >
        Рельеф, крупные жилы и несколько линий сразу: акцент уже начинает спорить с чёрным.
      variants:
        - id: К-47
          slug: k-47
          title: Чёрный камень с золотыми жилами, без металла
          text: >
            Тот же чёрно-золотой камень, но металла нет вовсе — золото даёт только рисунок жил. В двух
            исполнениях телевизор не показан.
          images: [k-47-1, k-47-2, k-47-3, k-47-4]
        - id: К-63
          slug: k-63
          title: "Чёрный: полосы и линии"
          text: >
            Чёрный глянец, разделённый тонкими светлыми линиями на вертикальные полосы; рисунок из блеска и
            линий, а не из материалов.
          images: [k-63-1, k-63-2, k-63-3, k-63-4]
        - id: К-50
          slug: k-50
          title: Рифлёная сатиновая полоса оттенка шампань
          text: >
            Чёрный глянец и узкая рифлёная полоса светлого металла оттенка шампань вдоль края колонны;
            единственный объёмный металл среди золотых вариантов.
          images: [k-50-1, k-50-2, k-50-3, k-50-4]
        - id: К-56
          slug: k-56
          title: Рифлёный никель
          text: >
            Серебряная пара к К-50: узкая рифлёная полоса брашированного никеля вдоль чёрной колонны.
          images: [k-56-1, k-56-2, k-56-3, k-56-4]
        - id: К-57
          slug: k-57
          title: Чёрный камень с белыми жилами и стальная рама
          text: >
            Чёрный мрамор с белыми жилами и широкая рама топки из полированной стали.
          images: [k-57-1, k-57-2, k-57-3, k-57-4]

    - id: max
      name: На максимум
      note: >
        Верхняя граница: полированное золото, широкие рамы, прозрачное зеркало. Показаны, чтобы была видна грань, за которой начинается лишнее.
      variants:
        - id: К-51
          slug: k-51
          title: Чёрный камень в полированных золотых рамах
          text: >
            Чёрный камень с жилами, верхнее поле и топка в многослойных рамах полированного золота. Самый
            золотой из вариантов — показан как верхняя граница.
          images: [k-51-1, k-51-2, k-51-3, k-51-4]
        - id: К-52
          slug: k-52
          title: Чёрный глянец и золотые рифлёные стойки
          text: >
            Вертикальные полированные золотые стойки в верхнем поле и золотая рама топки на чёрном глянце.
          images: [k-52-1, k-52-2, k-52-3, k-52-4]
        - id: К-53
          slug: k-53
          title: Чёрный камень с золотыми жилами и широкая золотая рама
          text: >
            Как К-46, но рама топки шире и полированная. В двух исполнениях телевизор не показан.
          images: [k-53-1, k-53-2, k-53-3, k-53-4]
        - id: К-61
          slug: k-61
          title: Прозрачное зеркало в золотой раме на чёрном камне
          text: >
            Чёрный мрамор с жилами и большое прозрачное зеркало в золотой раме в верхнем поле.
          images: [k-61-1, k-61-2, k-61-3, k-61-4]

    - id: cream
      name: Светлый камень для сравнения
      note: >
        Те же металлы и зеркала на светлом камне — чтобы сравнить с чёрным.
      variants:
        - id: К-64
          slug: k-64
          title: Светлый мрамор и стальная рама топки
          text: >
            Светлый мрамор с золотистыми жилами; топка в широкой раме из полированной стали.
          images: [k-64-1, k-64-2, k-64-3, k-64-4]
        - id: К-65
          slug: k-65
          title: Светлый мрамор и золотая рама топки
          text: >
            Тот же светлый мрамор; топка в раме полированного золота.
          images: [k-65-1, k-65-2, k-65-3, k-65-4]
        - id: К-66
          slug: k-66
          title: Светлый мрамор и рама из двух металлов
          text: >
            Рама топки из золота и стали вместе — проверка, уживаются ли два металла рядом.
          images: [k-66-1, k-66-2, k-66-3, k-66-4]
        - id: К-67
          slug: k-67
          title: Зеркало в золотой раме на светлом камне
          text: >
            Прямоугольное зеркало в золотой раме над топкой; исполнения различаются шириной и профилем рамы.
          images: [k-67-1, k-67-2, k-67-3]
        - id: К-68
          slug: k-68
          title: Зеркало в серебряной раме на светлом камне
          text: >
            Прямоугольное зеркало в серебряной раме над топкой. Телевизор в этих исполнениях не показан.
          images: [k-68-1, k-68-2, k-68-3, k-68-4]
        - id: К-69
          slug: k-69
          title: Зеркальная раскладка на светлом камне
          text: >
            Верхнее поле — зеркало в мелкой раскладке со светлыми переплётами.
          images: [k-69-1, k-69-2, k-69-3, k-69-4]
